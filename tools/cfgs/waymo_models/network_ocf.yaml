CLASS_NAMES: ['Vehicle', 'Pedestrian', 'Cyclist']

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/waymo_dataset_multiframe_ocf.yaml

    SAMPLED_INTERVAL: {
        'train': 1,
        'test': 1
    }

MODEL:
    NAME: Network_OCF

    VFE:
        NAME: MeanVFE

    BACKBONE_3D:
        NAME: Network_OCF
        
OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4 # default 4
    NUM_EPOCHS: 10

    OPTIMIZER: adam
    LR: 0.0005
    WEIGHT_DECAY: 0.0

    DECAY_STEP_LIST: [5]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10