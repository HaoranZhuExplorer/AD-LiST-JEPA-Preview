CLASS_NAMES: ['Vehicle', 'Pedestrian', 'Cyclist']

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/waymo_dataset_multiframe_bev_ocf.yaml

    SAMPLED_INTERVAL: {
        'train': 2,
        'test': 1
    }

MODEL:
    NAME: Network_BEV_OCF

    VFE:
        NAME: MeanVFE

    BACKBONE_3D:
        NAME: Network_BEV_OCF
        
OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4 # default 4
    NUM_EPOCHS: 10

    OPTIMIZER: adam_onecycle
    LR: 0.00003 # default 0.0003
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [35, 45]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10

    EMA:
        - 0.996
        - 1.0